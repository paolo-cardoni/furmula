<script>
  // Porta allo store del telefono: Google Play su Android, App Store su iPhone e iPad.
  var PLAY = 'https://play.google.com/store/apps/details?id=com.paolocardoni.furmula';
  var APPLE = 'https://apps.apple.com/app/id6831667126';
  var ua = navigator.userAgent;
  var ipad = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  if (/android/i.test(ua)) location.replace(PLAY);
  else if (/iPhone|iPad|iPod/.test(ua) || ipad) location.replace(APPLE);
</script>
